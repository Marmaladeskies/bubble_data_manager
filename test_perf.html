<!DOCTYPE html>
<html>
<head><title>Perf Test</title></head>
<body>
  <select id="data-type-selector"><option value="user" selected>user</option></select>
  <script>
    function isBooleanField(type, field) { return false; }
    function escapeHTML(str) { return str; }

    const records = [];
    for(let i=0; i<1000; i++) {
        const r = {_id: i};
        for(let j=0; j<20; j++) r['field'+j] = "val"+j;
        records.push(r);
    }
    const visibleHeaders = [];
    for(let j=0; j<20; j++) visibleHeaders.push('field'+j);
    const selectedRowIds = new Set();

    // Baseline test
    let tableHTML = "";
    console.time("Baseline");
    for (let k = 0; k < 100; k++) {
        records.forEach((record) => {
            visibleHeaders.forEach((header) => {
                let cellValue = record[header];
                const currentType = document.getElementById("data-type-selector")?.value || "";
                if (typeof cellValue === "boolean" || (isBooleanField(currentType, header) && (cellValue === "true" || cellValue === "false"))) {
                    cellValue = cellValue === true || cellValue === "true" ? "yes" : "no";
                }
            });
        });
    }
    console.timeEnd("Baseline");

    // Optimized test
    console.time("Optimized");
    for (let k = 0; k < 100; k++) {
        const currentType = document.getElementById("data-type-selector")?.value || "";
        records.forEach((record) => {
            visibleHeaders.forEach((header) => {
                let cellValue = record[header];
                if (typeof cellValue === "boolean" || (isBooleanField(currentType, header) && (cellValue === "true" || cellValue === "false"))) {
                    cellValue = cellValue === true || cellValue === "true" ? "yes" : "no";
                }
            });
        });
    }
    console.timeEnd("Optimized");
  </script>
</body>
</html>
