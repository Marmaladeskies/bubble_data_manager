<!DOCTYPE html>
<html>
<body>
<div id="test1"></div>
<script>
  function openJSONEditor(a, b, c) {
    console.log("Called with:", a, b, c);
    alert(a);
  }

  function escapeHTML(str) {
    if (typeof str !== "string") return str;
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  const recordId = "', alert(1), '";
  const field = "field";
  const jsonValue = "{}";

  const safeRecordId = escapeHTML(String(recordId));
  const safeField = escapeHTML(String(field));
  const safePreview = escapeHTML(jsonValue.substring(0, 30)) + (jsonValue.length > 30 ? "..." : "");

  const content = `<span class="json-badge" data-record-id="${safeRecordId}" data-field="${safeField}" onclick="openJSONEditor(this.getAttribute('data-record-id'), this.getAttribute('data-field'), this.closest('td') ? this.closest('td').getAttribute('data-json') : null)">JSON</span> <span style="font-size: 11px; color: #666; font-family: monospace;"> ${safePreview}</span>`;

  document.getElementById('test1').innerHTML = content;
</script>
</body>
</html>
